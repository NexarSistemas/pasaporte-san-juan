<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edición editorial de preguntas de Pasaporte San Juan." />
    <title>Preguntas | Administración Pasaporte San Juan</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Pasaporte San Juan</p>
        <h1>Administración de preguntas</h1>
      </div>
      <button id="logout-button" class="button button-secondary" type="button">Cerrar sesión</button>
    </header>
    <main class="admin-shell">
      <section class="panel" aria-labelledby="questions-title">
        <div class="panel-heading">
          <div>
            <h2 id="questions-title">Preguntas</h2>
            <p id="questions-count" class="muted" aria-live="polite"></p>
          </div>
          <div class="filters" aria-label="Filtros de preguntas">
            <label>
              Categoría
              <select id="category-filter"><option value="">Todas</option></select>
            </label>
            <label>
              Estado editorial
              <select id="status-filter">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="en_revision">En revisión</option>
                <option value="revisada">Revisada</option>
                <option value="publicada">Publicada</option>
                <option value="rechazada">Rechazada</option>
              </select>
            </label>
          </div>
        </div>
        <p id="list-message" class="message" role="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Categoría</th><th>Texto</th><th>Dificultad</th><th>Activo</th><th>Estado editorial</th><th><span class="sr-only">Acción</span></th></tr></thead>
            <tbody id="questions-body"></tbody>
          </table>
        </div>
      </section>

      <section id="editor-panel" class="panel editor-panel" hidden aria-labelledby="editor-title">
        <div class="panel-heading">
          <div>
            <h2 id="editor-title">Editar pregunta</h2>
            <p id="editor-meta" class="muted"></p>
          </div>
          <button id="close-editor" class="button button-secondary" type="button">Cerrar</button>
        </div>
        <form id="question-form">
          <div class="form-grid">
            <label class="full-width">Texto
              <textarea id="texto" name="texto" rows="4" required></textarea>
            </label>
            <label class="full-width">Texto original (referencia)
              <textarea id="texto-original" rows="4" readonly></textarea>
            </label>
            <label>Pista
              <textarea id="pista" name="pista" rows="3"></textarea>
            </label>
            <label>Explicación
              <textarea id="explicacion" name="explicacion" rows="3" required></textarea>
            </label>
            <label>Dificultad
              <select id="dificultad" name="dificultad" required>
                <option value="facil">Fácil</option><option value="media">Media</option><option value="dificil">Difícil</option>
              </select>
            </label>
            <label>Estado editorial
              <select id="estado-editorial" name="estado_editorial" required>
                <option value="pendiente">Pendiente</option><option value="en_revision">En revisión</option><option value="revisada">Revisada</option><option value="publicada">Publicada</option><option value="rechazada">Rechazada</option>
              </select>
            </label>
            <label>Fuente
              <input id="fuente" name="fuente" type="text" />
            </label>
            <label>URL de fuente
              <input id="url-fuente" name="url_fuente" type="url" />
            </label>
            <label class="full-width">Observaciones de revisión
              <textarea id="observaciones-revision" name="observaciones_revision" rows="3"></textarea>
            </label>
          </div>
          <p id="save-message" class="message" role="status" aria-live="polite"></p>
          <button id="save-button" class="button button-primary" type="submit">Guardar cambios</button>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
