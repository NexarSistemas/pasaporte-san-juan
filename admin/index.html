<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acceso a la administración de contenidos de Pasaporte San Juan." />
    <title>Administración | Pasaporte San Juan</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Pasaporte San Juan</p>
        <h1 id="login-title">Administración de contenidos</h1>
        <p class="intro">Ingresá con tu cuenta de administración para revisar las preguntas.</p>
        <form id="login-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <p id="auth-message" class="message" role="alert" aria-live="polite"></p>
          <button id="login-button" class="button button-primary" type="submit">Ingresar</button>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
